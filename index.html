<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI YouTube Scout &amp; Video Insights Dashboard</title>
<style>
:root {
  --bg: #f6f8f4;
  --surface: #ffffff;
  --surface-alt: #eef2eb;
  --ink: #10291f;
  --muted: #55665d;
  --line: #dce2d8;
  --accent: #b84a27;
  --accent-soft: #fdf1ed;
  --green: #146c43;
  --green-soft: #e7f4ed;
  --blue: #1d4ed8;
  --blue-soft: #eff6ff;
  --shadow: 0 10px 30px rgba(16, 41, 31, 0.06);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
}
.topbar {
  background: var(--ink);
  color: #fff;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-badge {
  background: var(--accent);
  color: #fff;
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 0.06em;
  padding: 5px 10px;
  border-radius: 6px;
  text-transform: uppercase;
}
.brand h1 { font-size: 19px; font-weight: 800; margin: 0; }
.brand p { margin: 2px 0 0; font-size: 12.5px; color: rgba(255,255,255,0.72); }
.stats-strip { display: flex; gap: 10px; }
.stat-pill {
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 9px;
  padding: 6px 12px;
  display: flex;
  flex-direction: column;
}
.stat-pill .v { font-size: 16px; font-weight: 800; color: #fff; }
.stat-pill .l { font-size: 10.5px; color: rgba(255,255,255,0.7); text-transform: uppercase; }
.toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.filters { display: flex; gap: 6px; }
.filter-btn {
  background: var(--surface-alt);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}
.filter-btn.active, .filter-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.toolbar-right { display: flex; align-items: center; gap: 8px; }
.search-input {
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 12.5px;
  width: 220px;
  background: var(--bg);
}
.workspace {
  display: grid;
  grid-template-columns: 450px 1fr;
  height: calc(100vh - 115px);
  overflow: hidden;
}
.feed-col {
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.video-card {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  cursor: pointer;
}
.video-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(184, 74, 39, 0.14);
}
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
.badge {
  font-size: 11px;
  font-weight: 800;
  padding: 3px 7px;
  border-radius: 6px;
  text-transform: uppercase;
  white-space: nowrap;
}
.badge.scouted { background: var(--accent-soft); color: var(--accent); border: 1px solid #f2c7b8; }
.badge.liked { background: var(--blue-soft); color: var(--blue); border: 1px solid #bfdbfe; }
.badge.playlist { background: var(--green-soft); color: var(--green); border: 1px solid #b8dfc8; }
.card-title { font-size: 16px; font-weight: 800; line-height: 1.3; margin: 0 0 6px; }
.card-meta { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
.card-summary { font-size: 13.5px; color: #2c3e35; line-height: 1.45; margin: 0 0 10px; }
.pillar-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pillar-tag { font-size: 11px; font-weight: 600; background: var(--surface-alt); padding: 2px 8px; border-radius: 5px; }
.detail-col { overflow-y: auto; padding: 28px 40px 80px; background: var(--surface); }
.detail-header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 24px; }
.detail-kicker { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.detail-title { font-size: 28px; font-weight: 800; line-height: 1.2; margin: 0 0 12px; }
.action-bar { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: 9px;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface-alt);
  color: var(--ink);
  text-decoration: none;
}
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.green { background: var(--green); color: #fff; border-color: var(--green); }
.player-box {
  margin: 0 0 24px;
  border-radius: 14px;
  overflow: hidden;
  background: #000;
  aspect-ratio: 16 / 9;
  max-width: 820px;
  display: none;
}
.player-box.open { display: block; }
.player-box iframe { width: 100%; height: 100%; border: 0; }
.takeaway-Banner {
  background: var(--green-soft);
  border-left: 5px solid var(--green);
  padding: 18px 22px;
  border-radius: 10px;
  margin-bottom: 22px;
}
.takeaway-Banner h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; color: var(--green); }
.takeaway-Banner p { margin: 0; font-size: 15.5px; font-weight: 600; }
.ideas-box {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 26px;
}
.ideas-box h3 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; color: var(--accent); }
.idea-item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 14.5px; font-weight: 600; }
.brief-body table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 14px 0; }
.brief-body th, .brief-body td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
.brief-body th { background: var(--bg); }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">AI YouTube Scout</span>
      <div>
        <h1>Video Insights &amp; Idea Triage Dashboard</h1>
        <p>Grounded in your Taste Profile · Creator RSS Scout · 1-Page Action Briefs</p>
      </div>
    </div>
    <div class="stats-strip">
      <div class="stat-pill"><span class="v">508</span><span class="l">Taste Profile Saves</span></div>
      <div class="stat-pill"><span class="v">16</span><span class="l">Core Creators</span></div>
      <div class="stat-pill"><span class="v">3</span><span class="l">1-Page Briefs Ready</span></div>
      <div class="stat-pill"><span class="v">Top 3</span><span class="l">Queued to Playlist</span></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All Briefs (3)</button>
      <button class="filter-btn" data-filter="scouted">AI Scouted</button>
      <button class="filter-btn" data-filter="liked">Liked</button>
      <button class="filter-btn" data-filter="Claude & Harnesses">Claude &amp; Harnesses</button>
      <button class="filter-btn" data-filter="Video & Content">Video &amp; Content</button>
    </div>
    <div class="toolbar-right">
      <input type="search" id="search" class="search-input" placeholder="Search briefs, creators, numbers...">
      <a class="btn" href="taste-profile.example.md" target="_blank">Taste Profile</a>
    </div>
  </div>

  <div class="workspace">
    <aside class="feed-col" id="feed"></aside>
    <main class="detail-col" id="detail"></main>
  </div>

<script>
const BRIEFS = [{"id": "2026-10-29-kimi-k3-vs-claude-opus-nick-saraev", "file": "briefs/2026-10-29-kimi-k3-vs-claude-opus-nick-saraev.md", "title": "I Tested China's New Model vs Claude Opus 5.5 (Kimi K3.1)", "url": "https://www.youtube.com/watch?v=OBzWl3Bw1JY", "yt_id": "OBzWl3Bw1JY", "channel": "Nick Saraev", "date": "2026-10-29", "origin_kind": "scouted", "origin_label": "AI Scouted · 2026-10-29", "score": 10, "chars": "14,916", "duration_label": "13 minutes", "in_playlist": true, "bottom_line": "Across 8 identical side-by-side coding tasks, Claude Opus 5.5 produced higher visual polish and geometry when it worked, but shipped broken/unverified builds in 2 of the 8 tests (a 3D keyboard that failed to load and a voxel game where the player could not move) because its harness did not verify runtime execution before finishing. Kimi K3.1 Pro finished faster (29m41s vs. 47m02s) at half the token price ($2/$10 per 1M tokens) and had fewer broken builds. Even frontier models at max effort ship broken interactive states unless your agent harness enforces an automated runtime smoke check.", "action_items": ["Enforce an automated browser smoke test (verify gate) after every UI build before marking a task complete.", "Benchmark a secondary worker model on one bounded, non-confidential evaluation task to compare cost and latency."], "pillars": ["Claude & Harnesses", "Agency & Revenue", "Video & Content"], "sort": ["2026-10-29", "23:59"], "body_html": "<ul><li>Date analyzed: 2026-10-29</li><li>Source: <a href=\"https://www.youtube.com/watch?v=OBzWl3Bw1JY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=OBzWl3Bw1JY</a> (Nick Saraev), scouted 2026-10-29 (score 10)</li><li>Transcript: complete, 14,916 characters (about 13 minutes). Fetched through Google NotebookLM.</li><li>Grounded in: <code>taste-profile.md</code></li></ul>\n<h3>1. Bottom line for you</h3>\n<p>Across 8 identical side-by-side coding tasks, Claude Opus 5.5 produced higher visual polish and geometry when it worked, but shipped broken/unverified builds in 2 of the 8 tests (a 3D keyboard that failed to load and a voxel game where the player could not move) because its harness did not verify runtime execution before finishing. Kimi K3.1 Pro finished faster (29m41s vs. 47m02s) at half the token price ($2/$10 per 1M tokens) and had fewer broken builds. Even frontier models at max effort ship broken interactive states unless your agent harness enforces an automated runtime smoke check.</p>\n<h3>2. Key ideas from the video</h3>\n<p>Self-interest labels: Speaker runs an automation agency and Skool community; states both models were tested on standard plans with no sponsor disclosure.</p>\n<div class=\"tbl\"><table><thead><tr><th>#</th><th>Idea</th><th>Detail</th></tr></thead><tbody><tr><td>1</td><td>Speed vs. polish tradeoff</td><td>Across 8 parallel builds at max effort, Kimi K3.1 Pro averaged 29m41s per build vs. 47m02s for Claude Opus 5.5.</td></tr><tr><td>2</td><td>Max-effort Opus still skips runtime verification</td><td>On 2 of 8 demos (3D mechanical keyboard and 3D exploration game), Opus delivered higher-resolution assets that failed on first load until prompted again.</td></tr><tr><td>3</td><td>Native Swarm &amp; clarifying-question UI</td><td>Kimi's web harness asks structured multiple-choice clarifying questions upfront and spawns parallel subagents to build 10 variations at once.</td></tr><tr><td>4</td><td>Half-price token economics</td><td>At $2/1M input and $10/1M output tokens, Kimi K3.1 Pro is roughly half the API cost of Opus 5.5 for background worker or judge lanes.</td></tr></tbody></table></div>\n<h3>3. How this applies to you</h3>\n<ul><li><strong>Claude &amp; Agent Harnesses:</strong> Pair frontier visual generation with an automated headless-browser verification step so broken interactive states never reach review.</li><li><strong>Multi-Agent Cost Control:</strong> Evaluate lower-cost frontier models as secondary judges or bulk workers while keeping Opus/Sonnet for primary architecture and UI polish.</li></ul>\n<h3>4. Suggested next steps</h3>\n<ol><li>Enforce an automated browser smoke test (<code>verify</code> gate) after every UI build before marking a task complete.</li><li>Benchmark a secondary worker model on one bounded, non-confidential evaluation task to compare cost and latency.</li></ol>"}, {"id": "2026-10-28-creative-context-os-three-files", "file": "briefs/2026-10-28-creative-context-os-three-files.md", "title": "Train Your AI to Write Like a Human With Just 3 Files", "url": "https://www.youtube.com/watch?v=yDFCJzDgWhI", "yt_id": "yDFCJzDgWhI", "channel": "Marketing Against the Grain", "date": "2026-10-28", "origin_kind": "liked", "origin_label": "Liked · 2026-10-28", "score": 9, "chars": "29,317", "duration_label": "29 minutes", "in_playlist": true, "bottom_line": "Most AI writing sounds like commodity filler because the model has general knowledge but zero point of view. Splitting context into three focused files—creator.md (how you think and write, built from real examples rather than adjectives), audience.md (five specific dream readers and their real bottlenecks), and taste.md (your quality bar, never-do list, and publish test)—lets an agent critique and draft with your actual voice.", "action_items": ["Maintain an explicit negative-filter list in taste-profile.md and enforce it with a deterministic check.", "Run a separate critic pass against taste-profile.md rather than stuffing every rule into a single generation prompt."], "pillars": ["Claude & Harnesses", "Agency & Revenue", "Video & Content"], "sort": ["2026-10-28", "12:00"], "body_html": "<ul><li>Date analyzed: 2026-10-28</li><li>Source: <a href=\"https://www.youtube.com/watch?v=yDFCJzDgWhI\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=yDFCJzDgWhI</a> (Marketing Against the Grain), liked 2026-10-28 (score 9)</li><li>Transcript: complete, 29,317 characters (about 29 minutes). Fetched through Google NotebookLM.</li><li>Grounded in: <code>taste-profile.md</code></li></ul>\n<h3>1. Bottom line for you</h3>\n<p>Most AI writing sounds like commodity filler because the model has general knowledge but zero point of view. Splitting context into three focused files—<code>creator.md</code> (how you think and write, built from real examples rather than adjectives), <code>audience.md</code> (five specific dream readers and their real bottlenecks), and <code>taste.md</code> (your quality bar, never-do list, and publish test)—lets an agent critique and draft with your actual voice.</p>\n<h3>2. Key ideas from the video</h3>\n<p>Self-interest labels: Podcast published by HubSpot; promotes a lead-magnet prompt pack and an affiliated tool.</p>\n<div class=\"tbl\"><table><thead><tr><th>#</th><th>Idea</th><th>Detail</th></tr></thead><tbody><tr><td>1</td><td>The 3-file context architecture</td><td>Separate <code>creator.md</code> (voice &amp; real examples), <code>audience.md</code> (specific buyer profiles), and <code>taste.md</code> (quality bar &amp; negative rules).</td></tr><tr><td>2</td><td>Strip one-off viral outliers</td><td>Remove one-time launch announcements or outlier posts from your voice training set so the agent learns repeatable structure.</td></tr><tr><td>3</td><td>Sequential pass beats single mega-prompt</td><td>Loading all three files at once caused the model to ignore <code>taste.md</code>; running a dedicated second pass against <code>taste.md</code> caught AI tells reliably.</td></tr></tbody></table></div>\n<h3>3. How this applies to you</h3>\n<ul><li><strong>Claude &amp; Harnesses:</strong> Keep a dedicated <code>taste-profile.md</code> with explicit negative filters and run a separate verification pass after drafting.</li><li><strong>Agency &amp; Revenue:</strong> Package the 3-file interview (<code>creator.md</code>, <code>audience.md</code>, <code>taste.md</code>) as the onboarding step for any client content or communication system.</li></ul>\n<h3>4. Suggested next steps</h3>\n<ol><li>Maintain an explicit negative-filter list in <code>taste-profile.md</code> and enforce it with a deterministic check.</li><li>Run a separate critic pass against <code>taste-profile.md</code> rather than stuffing every rule into a single generation prompt.</li></ol>"}, {"id": "2026-10-29-show-me-your-workflow-ai-editing-instagram", "file": "briefs/2026-10-29-show-me-your-workflow-ai-editing-instagram.md", "title": "His AI Made 20 Reels Before Breakfast", "url": "https://www.youtube.com/watch?v=AtjFk9f44HE", "yt_id": "AtjFk9f44HE", "channel": "Matt Wolfe & Nate Herk", "date": "2026-10-28", "origin_kind": "liked", "origin_label": "Liked · 2026-10-28", "score": 9, "chars": "44,981", "duration_label": "38 minutes", "in_playlist": true, "bottom_line": "The highest-leverage pattern in this interview is building an agent skill from a \"golden set\" of proven work rather than inventing rules in a blank prompt. By having Claude Code study 27 top-performing human-edited videos frame by frame (extracting scene-change intervals, audio ducking levels, and graphic timing), every correction compounds into a reusable skill file instead of getting lost in chat history.", "action_items": ["Build a golden-set reference table from your top-performing videos or posts before tuning a new content skill.", "Add an automated contact-sheet and word-sync check before rendering any long-form video."], "pillars": ["Claude & Harnesses", "Agency & Revenue", "Video & Content"], "sort": ["2026-10-28", "12:00"], "body_html": "<ul><li>Date analyzed: 2026-10-29</li><li>Source: <a href=\"https://www.youtube.com/watch?v=AtjFk9f44HE\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=AtjFk9f44HE</a> (Matt Wolfe &amp; Nate Herk), liked 2026-10-28 (score 9)</li><li>Transcript: complete, 44,981 characters (about 38 minutes). Fetched through Google NotebookLM.</li><li>Grounded in: <code>taste-profile.md</code></li></ul>\n<h3>1. Bottom line for you</h3>\n<p>The highest-leverage pattern in this interview is building an agent skill from a \"golden set\" of proven work rather than inventing rules in a blank prompt. By having Claude Code study 27 top-performing human-edited videos frame by frame (extracting scene-change intervals, audio ducking levels, and graphic timing), every correction compounds into a reusable skill file instead of getting lost in chat history.</p>\n<h3>2. Key ideas from the video</h3>\n<p>Self-interest labels: Guest sells a paid community and uses free repos as lead magnets; host runs a sponsored newsletter.</p>\n<div class=\"tbl\"><table><thead><tr><th>#</th><th>Idea</th><th>Detail</th></tr></thead><tbody><tr><td>1</td><td>Reverse-engineer a golden set</td><td>Analyze 20-27 proven examples by screenshotting every few seconds to record cut timing, layout patterns, and audio levels into a skill file.</td></tr><tr><td>2</td><td>Word timestamps + waveform silence check</td><td>Combine word-level transcription timestamps with an audio waveform check so cuts never clip the tail of a spoken word.</td></tr><tr><td>3</td><td>Screenshot verification loop</td><td>Bake \"screenshot every rendered element and verify it is inside safe bounds\" into any visual agent workflow.</td></tr><tr><td>4</td><td>Compounding feedback log</td><td>Save every human review correction back into the skill's rules file so the next run requires fewer manual edits.</td></tr></tbody></table></div>\n<h3>3. How this applies to you</h3>\n<ul><li><strong>Video &amp; Content Flywheel:</strong> Derive editing and layout presets directly from your best-performing uploads and verify every visual beat with a contact sheet before final render.</li><li><strong>Claude &amp; Harnesses:</strong> Log every human review fix into a persistent rules file so the agent never repeats the same layout or pacing mistake twice.</li></ul>\n<h3>4. Suggested next steps</h3>\n<ol><li>Build a golden-set reference table from your top-performing videos or posts before tuning a new content skill.</li><li>Add an automated contact-sheet and word-sync check before rendering any long-form video.</li></ol>"}];
let activeFilter = 'all';
let searchQuery = '';
let selectedId = BRIEFS[0].id;

function renderFeed() {
  const feed = document.getElementById('feed');
  const q = searchQuery.toLowerCase();
  const filtered = BRIEFS.filter(b => {
    if (activeFilter === 'scouted' && b.origin_kind !== 'scouted') return false;
    if (activeFilter === 'liked' && b.origin_kind !== 'liked') return false;
    if (!['all','scouted','liked'].includes(activeFilter) && !b.pillars.includes(activeFilter)) return false;
    if (q && !(b.title.toLowerCase().includes(q) || b.channel.toLowerCase().includes(q) || b.bottom_line.toLowerCase().includes(q))) return false;
    return true;
  });

  feed.innerHTML = filtered.map(b => `
    <div class="video-card ${b.id === selectedId ? 'selected' : ''}" onclick="selectBrief('${b.id}')">
      <div class="card-top">
        <span class="badge ${b.origin_kind}">${b.origin_label}</span>
        ${b.score ? `<span class="badge scouted">Score ${b.score}/10</span>` : ''}
      </div>
      <h3 class="card-title">${b.title}</h3>
      <div class="card-meta"><strong>${b.channel}</strong> ${b.duration_label ? '· ' + b.duration_label : ''}</div>
      <p class="card-summary">${b.bottom_line}</p>
      <div class="pillar-row">${b.pillars.map(p => `<span class="pillar-tag">${p}</span>`).join('')}</div>
    </div>
  `).join('');
}

function selectBrief(id) {
  selectedId = id;
  renderFeed();
  const b = BRIEFS.find(x => x.id === id) || BRIEFS[0];
  document.getElementById('detail').innerHTML = `
    <div class="detail-header">
      <div class="detail-kicker">
        <span class="badge ${b.origin_kind}">${b.origin_label}</span>
        ${b.score ? `<span class="badge scouted">Taste Match Score: ${b.score}/10</span>` : ''}
        <span style="color:var(--muted);font-size:13px">${b.channel} ${b.duration_label ? '· ' + b.duration_label : ''}</span>
      </div>
      <h2 class="detail-title">${b.title}</h2>
      <div class="action-bar">
        ${b.yt_id ? `<button class="btn primary" onclick="toggleVideo('${b.yt_id}')">▶ Watch Video Here</button>` : ''}
        ${b.url ? `<a class="btn" href="${b.url}" target="_blank" rel="noopener">↗ Open on YouTube</a>` : ''}
        <a class="btn" href="${b.file}" target="_blank">📄 Raw Markdown</a>
      </div>
    </div>
    <div class="player-box" id="player-box"><iframe id="yt-iframe" src="" allowfullscreen></iframe></div>
    <div class="takeaway-Banner"><h3>90-Second Bottom Line</h3><p>${b.bottom_line}</p></div>
    <div class="ideas-box">
      <h3>Actionable Ideas Extracted for Your 60-Day Goals</h3>
      ${b.action_items.map(item => `<label class="idea-item"><input type="checkbox" checked><span>${item}</span></label>`).join('')}
    </div>
    <div class="brief-body">${b.body_html}</div>
  `;
}

function toggleVideo(ytId) {
  const box = document.getElementById('player-box');
  const iframe = document.getElementById('yt-iframe');
  if (box.classList.contains('open')) { box.classList.remove('open'); iframe.src = ''; }
  else { box.classList.add('open'); iframe.src = 'https://www.youtube.com/embed/' + ytId + '?autoplay=1'; }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderFeed();
  });
});
document.getElementById('search').addEventListener('input', e => { searchQuery = e.target.value; renderFeed(); });
renderFeed();
selectBrief(selectedId);
</script>
</body>
</html>
